# Prometheus alerting rules — Pokémon Vault (§69)
# No PII in labels; only service/queue/route/metric names.
groups:
  - name: api
    rules:
      - alert: Api5xxSpike
        expr: |
          sum(rate(http_errors_total[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "API 5xx rate above 5% for 5 minutes"
          runbook: "docs/observability/alerting.md#2-api-5xx-spike"

      - alert: ApiHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le, route) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "API p95 latency above 1s for 10 minutes"
          runbook: "docs/observability/alerting.md#3-high-latency"

      - alert: DbDown
        expr: rate(db_query_duration_seconds_count[5m]) == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "No successful DB queries in 5 minutes (DB down?)"
          runbook: "docs/observability/alerting.md#4-database"

      - alert: DbHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(db_query_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "DB p95 query latency above 1s"
          runbook: "docs/observability/alerting.md#4-database"

      - alert: RedisDown
        expr: rate(redis_command_duration_seconds_count[5m]) == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "No successful Redis commands in 2 minutes"
          runbook: "docs/observability/alerting.md#5-redis"

      - alert: QueueDepthHigh
        expr: queue_depth{state="waiting"} > 500
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Queue {{ $labels.queue }} waiting depth > 500 for 10 minutes"
          runbook: "docs/observability/alerting.md#6-queues--worker"

      - alert: QueueFailedSpike
        expr: sum(increase(queue_job_failures_total[15m])) > 50
        labels: { severity: warning }
        annotations:
          summary: "More than 50 job failures in 15 minutes"
          runbook: "docs/observability/alerting.md#6-queues--worker"

      - alert: InventoryReservationFailed
        expr: increase(inventory_reservations_failed_total[15m]) > 10
        labels: { severity: warning }
        annotations:
          summary: "Inventory reservation failures climbing"
          runbook: "docs/observability/alerting.md#8-inventory-reservations"
