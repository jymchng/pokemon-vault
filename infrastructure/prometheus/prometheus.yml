# Prometheus config — Pokémon Vault (§67)
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerting-rules.yml

scrape_configs:
  - job_name: pokemon-vault-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3001"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
