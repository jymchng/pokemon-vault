# Dependabot (§77, §83): automated dependency updates — pnpm (npm ecosystem)
# + GitHub Actions. Weekly digest, low noise.
#
# No blind major auto-upgrades (§84): semver-major bumps are IGNORED by
# Dependabot — they require a human to open the upgrade deliberately, review
# the migration/breaking changes, and let the PR pipeline + staging prove it.
# Minors/patches update automatically with versioning-strategy: increase
# (respects the lockfile and keeps ranges accurate).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/apps/worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Etc/UTC"
    labels: ["dependencies", "ci"]
