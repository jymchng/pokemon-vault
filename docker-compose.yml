# Pokémon Vault — local development environment
# One command:  docker compose up -d
# Services: postgres, redis, minio, mailpit, api, worker, web
name: pokemon-vault-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: pv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemon}
      POSTGRES_DB: ${POSTGRES_DB:-pokemon_vault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokemon} -d ${POSTGRES_DB:-pokemon_vault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pv-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pv-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: pv-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: development
    container_name: pv-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      POKE_VAULT_DATABASE_URL: postgresql://${POSTGRES_USER:-pokemon}:${POSTGRES_PASSWORD:-pokemon}@postgres:5432/${POSTGRES_DB:-pokemon_vault}?schema=public
      POKE_VAULT_REDIS_URL: redis://redis:6379
      POKE_VAULT_S3_ENDPOINT: http://minio:9000
      POKE_VAULT_S3_BUCKET: ${POKE_VAULT_S3_BUCKET:-pokemon-vault}
      POKE_VAULT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      POKE_VAULT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      POKE_VAULT_SMTP_HOST: mailpit
      POKE_VAULT_SMTP_PORT: 1025
      POKE_VAULT_WEB_ORIGIN: http://localhost:3000
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pv-net

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
      target: development
    container_name: pv-worker
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      POKE_VAULT_DATABASE_URL: postgresql://${POSTGRES_USER:-pokemon}:${POSTGRES_PASSWORD:-pokemon}@postgres:5432/${POSTGRES_DB:-pokemon_vault}?schema=public
      POKE_VAULT_REDIS_URL: redis://redis:6379
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
      - /app/apps/worker/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The worker exposes no HTTP port — probe container/process liveness.
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pv-net

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: development
    container_name: pv-web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      POKE_VAULT_NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pv-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  pv-net:
    driver: bridge
